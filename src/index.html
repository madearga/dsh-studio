<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Studio</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main>
      <div class="glyph" aria-hidden="true">
        <span class="prompt">$</span><span class="bar"></span>
      </div>
      <h1>DSH <span>Studio</span></h1>
      <p id="status">starting engine…</p>
      <p id="note" class="note" hidden></p>
      <div class="row" id="row" hidden>
        <button id="again">try again</button>
        <button id="bye" class="ghost">quit</button>
      </div>
    </main>
    <script src="boot.js"></script>
  </body>
</html>
